<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Omkiii | Omkar's AI Sidekick</title>
  <style>
    :root {
      --bg: #000;
      --bg2: #0a0a0a;
      --card: #111;
      --text: #f5f5f5;
      --text2: #b6b6b6;
      --muted: #7d7d7d;
      --border: rgba(255, 255, 255, .12);
      --accent: #10b981;
      --btn-on-accent: #001f16;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { min-height: 100dvh; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    button, textarea { font: inherit; }
    .chatbot-container { width: 100%; height: 100dvh; }
    .chatbot-panel { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
    .chatbot-header { display: flex; align-items: center; gap: .7rem; flex: 0 0 auto; padding: calc(.75rem + env(safe-area-inset-top)) 1rem .75rem; border-bottom: 1px solid var(--border); }
    .chatbot-heading { display: flex; align-items: center; gap: .7rem; min-width: 0; }
    .chatbot-avatar { width: 38px; height: 38px; flex: 0 0 38px; overflow: hidden; border-radius: 50%; background: var(--accent); }
    .chatbot-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .chatbot-header h3 { margin: 0; font-size: .95rem; letter-spacing: .06em; }
    .chatbot-heading p { margin: .2rem 0 0; color: var(--muted); font-size: .7rem; }
    .chatbot-status::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 .3rem .05rem .4rem; border-radius: 50%; background: #34d399; }
    .chatbot-clear, .chatbot-close { border: 0; color: var(--muted); background: transparent; cursor: pointer; min-width: 44px; min-height: 44px; }
    .chatbot-clear { margin-left: auto; font-size: .72rem; }
    .chatbot-close { position: relative; z-index: 1; font-size: 1.6rem; touch-action: manipulation; }
    .chatbot-clear:hover, .chatbot-close:hover { color: var(--text); }
    .chatbot-messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: .8rem; padding: 1rem; }
    .chatbot-message { display: flex; flex-direction: column; gap: .25rem; animation: fadeUp .25s ease; }
    .chatbot-message.user { align-items: flex-end; }
    .chatbot-message-content { max-width: 88%; padding: .8rem .95rem; border-radius: 14px; color: var(--text2); border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; font-size: .88rem; line-height: 1.55; }
    .chatbot-message.user .chatbot-message-content { color: var(--btn-on-accent); background: var(--accent); border-color: var(--accent); }
    .chatbot-suggestions { display: flex; flex: 0 0 auto; gap: .45rem; overflow-x: auto; padding: 0 1rem .75rem; scrollbar-width: none; }
    .chatbot-suggestions:empty { display: none; }
    .chatbot-suggestion, .chatbot-action, .chatbot-retry { border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text2); cursor: pointer; font-size: .72rem; padding: .45rem .7rem; text-decoration: none; }
    .chatbot-suggestion { flex: 0 0 auto; white-space: nowrap; }
    .chatbot-actions { display: flex; flex-wrap: wrap; gap: .4rem; max-width: 88%; }
    .chatbot-retry { align-self: flex-start; }
    .chatbot-typing { align-self: flex-start; display: inline-flex; align-items: center; gap: .22rem; color: var(--muted); padding: .7rem .85rem; font-size: .72rem; }
    .chatbot-typing span { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: chatbotPulse 1.1s infinite ease-in-out; }
    .chatbot-typing span:nth-child(2) { animation-delay: .15s; }
    .chatbot-typing span:nth-child(3) { animation-delay: .3s; }
    .chatbot-typing em { margin-left: .25rem; font-style: normal; }
    .chatbot-input-wrapper { display: flex; flex: 0 0 auto; gap: .5rem; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
    .chatbot-form { display: flex; width: 100%; gap: .5rem; }
    .chatbot-input { width: 100%; min-height: 44px; max-height: 110px; resize: none; padding: .7rem .85rem; border: 1px solid var(--border); border-radius: 12px; outline: 0; background: var(--card); color: var(--text); line-height: 1.4; }
    .chatbot-input:focus { border-color: var(--accent); }
    .chatbot-send { min-width: 46px; min-height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: var(--btn-on-accent); cursor: pointer; font-size: 1.1rem; }
    .chatbot-send:disabled { opacity: .5; cursor: wait; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes chatbotPulse { 0%, 80%, 100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .chatbot-message { animation: none; } }
  </style>
</head>
<body data-chat-page="true">
  <main id="chatbotContainer" class="chatbot-container">
    <section class="chatbot-panel open" id="chatbotPanel" role="dialog" aria-label="Omkiii chat" aria-modal="true">
      <header class="chatbot-header">
        <div class="chatbot-heading">
          <div class="chatbot-avatar" aria-hidden="true"><img src="images/image.png" alt="" /></div>
          <div>
            <h3>OMKIII</h3>
            <p>Omkar's AI sidekick <span class="chatbot-status">Active</span></p>
          </div>
        </div>
        <button class="chatbot-clear" id="chatbotClear" type="button">Clear</button>
        <button class="chatbot-close" id="chatbotClose" type="button" aria-label="Back to portfolio">&times;</button>
      </header>
      <div class="chatbot-messages" id="chatbotMessages"></div>
      <div class="chatbot-suggestions" id="chatbotSuggestions" aria-label="Suggested questions"></div>
      <div class="chatbot-input-wrapper">
        <form class="chatbot-form" id="chatbotForm">
        <textarea id="chatbotInput" class="chatbot-input" rows="1" placeholder="Ask anything about Omkar..." autocomplete="off" aria-label="Message for Omkiii"></textarea>
        <button class="chatbot-send" id="chatbotSend" type="submit" aria-label="Send message">→</button>
        </form>
      </div>
    </section>
  </main>
  <script src="chatbot.js" defer></script>
</body>
</html>
